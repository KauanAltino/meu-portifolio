<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Redirecionando...</title>
    <script>
      const l = window.location;
      const pathname = l.pathname.replace(/\/$/, '');
      const repoBase = pathname.includes('/meu-portifolio') ? '/meu-portifolio' : '';
      const route = pathname.replace(repoBase, '').replace(/^\//, '');
      const redirect = `${repoBase || '/'}${route ? `/?p=${encodeURIComponent(route)}` : '/'}${l.search ? `&q=${encodeURIComponent(l.search.slice(1))}` : ''}${l.hash}`;
      l.replace(redirect);
    </script>
  </head>
  <body></body>
</html>
